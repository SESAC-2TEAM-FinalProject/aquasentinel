# Terraform 레포 CI — 자체 러너(태그 eks-self-hosted)에서 실행한다. 태그 이름은
# "eks-self-hosted" 그대로지만 **2026-10-14(7단계)부터 러너는 EKS 클러스터 밖
# 전용 EC2에 있다**(terraform/global/runner). 태그는 다른 레포 CI(api-module ·
# web)도 같이 쓰고 있어 바꾸면 그쪽까지 고쳐야 해서 유지했다.
#
# 이전 배경: Terraform 이 그 EKS 클러스터 자체를 destroy/수정하는데 실행 환경이
# 그 클러스터 안에 있으면 apply 가 클러스터를 망가뜨리는 순간 CI 도 같이 사라지는
# 순환 의존이 생긴다(docs/AquaSentinel_GitLab러너_클러스터밖_이전_배경과계획 참고).
#
# **이전 전에는 이걸 운영 규칙으로만 막고 있었다** — "rebuild/1-network ·
# rebuild/2-cluster 의 apply/destroy 와 전체 재구축은 로컬에서 실행한다". 러너가
# 클러스터 밖으로 나오면서 이 규칙은 구조로 대체됐다(사람이 지켜야만 안전한 상태가
# 아니게 됨). 다만 apply 는 여전히 전부 수동 승인이다.
# 인증은 그대로 terraform/modules/aws-cicd 의 IAM Role(GitLab ID 토큰 OIDC) — 러너 위치와 무관.
#
# 경로 구조 개편(2026-10-10)에 맞춰 feat/gitlab-ci-terraform-pipeline-20261009의
# 원본을 새 레이아웃(global/, {seoul,tokyo}/persistent/, {seoul,tokyo}/rebuild/
# {1-network..4-edge}/)에 맞게 다시 썼다 — 모듈 목록도 11→8로 줄어든 걸 반영
# (aws-access/aws-ingress/aws-api-raw-store/aws-observability-storage/aws-eso는
# aws-irsa+aws-storage로 흡수되거나 구조 밖으로 빠짐).
#
# 범위에서 제외되는 것(둘 다 "CI가 쓸 것 자체를 만드는" 닭과 달걀 컴포넌트,
# 최초 1회 수동 적용):
#   - terraform/global/bootstrap/  (tfstate 백엔드 S3 버킷 자체)
#   - terraform/global/cicd/       (이 파이프라인이 쓰는 IAM Role 자체)
#
# 도쿄는 D4(상시 운영) 이후로 셋으로 나뉜다:
#   - tokyo/persistent/   서울과 동일하게 자동 plan + 수동 승인 apply(상시 관리 대상)
#   - tokyo/runner/       DR 러너(2026-10-27 신설). persistent 와 같은 층 —
#                         재구축 주기 밖이라 도쿄를 내려도 살아 있어야 한다.
#                         validate 자동 + plan(MR) + apply 수동.
#   - tokyo/rebuild/*     자동 트리거 없음, 전부 when: manual — 재해 상황에만 사람이
#                         직접 버튼을 눌러 실행한다(DR 전제와 상충하는 자동
#                         destroy/apply 방지)
#
# 적용 순서(수동 승인 시 반드시 지킬 것, 파이프라인이 강제하지는 않음):
#   persistent → rebuild/1-network → rebuild/2-cluster → rebuild/3-gitops → rebuild/4-edge
# 2-cluster가 persistent의 remote_state를 읽고, 3-gitops/4-edge가 2-cluster의
# remote_state를 읽는 구조라 역순 apply는 "no state file" 에러로 바로 드러난다.

# 같은 커밋이 브랜치 파이프라인 · MR 파이프라인으로 두 번 도는 것을 막는다 —
# MR 이 열린 브랜치는 MR 파이프라인만 돌린다(자체 러너 노드 디스크 · 동시 실행 수 절약).
# main push 와 MR 이 없는 브랜치는 그대로 브랜치 파이프라인이 돈다.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - validate
  - plan
  - apply

variables:
  TF_VERSION: "1.10"

default:
  # hashicorp/terraform 이미지는 ENTRYPOINT가 ["terraform"]으로 고정돼 있어
  # entrypoint를 비워주지 않으면 Runner가 넣는 셸 스크립트 실행 자체가 깨진다
  # (GitLab 공식 Terraform 연동 가이드에 명시된 알려진 함정).
  image:
    name: hashicorp/terraform:${TF_VERSION}
    entrypoint: [""]
  # EKS 자체 러너만 잡을 받는다(공유 러너 꺼짐) — 태그가 없으면 "온라인 러너 없음"으로 대기한다
  tags: [eks-self-hosted]

# ---------------------------------------------------------------------------
# 항상 실행되는 게이트 잡 — paths 필터(rules:changes) 때문에 아무 잡도 안 돌면
# "필수 상태 검사"가 영원히 대기 상태로 남는 함정(연구 메모 참고)을 막는다.
# GitLab 프로젝트 설정에서 "Pipelines must succeed"의 기준으로 이 잡을 쓴다.
# ---------------------------------------------------------------------------
ci-gate:
  stage: validate
  image: alpine:3.20
  script:
    - echo "pipeline ran"
  rules:
    - when: always

# ---------------------------------------------------------------------------
# GitLab ID 토큰 → AWS OIDC. 토큰의 aud를 "https://aws"로 커스터마이징하고
# (terraform/modules/aws-cicd가 그 aud로 OIDC Provider를 만들어둠), 표준
# AWS_ROLE_ARN/AWS_WEB_IDENTITY_TOKEN_FILE 환경변수로 넘기면 AWS Provider가
# 별도 설정 없이 자동으로 picks up한다(EKS IRSA와 같은 메커니즘, 토큰 출처만 다름).
# TF_PLAN_ROLE_ARN/TF_APPLY_ROLE_ARN은 GitLab CI/CD 변수(Protected+Masked)로
# 등록 — 값은 global/cicd를 수동 적용한 뒤 나온 output.
# ---------------------------------------------------------------------------
.aws_oidc_plan:
  id_tokens:
    AWS_ID_TOKEN:
      aud: https://aws
  before_script:
    - export AWS_ROLE_ARN="${TF_PLAN_ROLE_ARN}"
    - export AWS_WEB_IDENTITY_TOKEN_FILE="$(pwd)/.aws_web_identity_token"
    - echo "${AWS_ID_TOKEN}" > "${AWS_WEB_IDENTITY_TOKEN_FILE}"

.aws_oidc_apply:
  id_tokens:
    AWS_ID_TOKEN:
      aud: https://aws
  before_script:
    - export AWS_ROLE_ARN="${TF_APPLY_ROLE_ARN}"
    - export AWS_WEB_IDENTITY_TOKEN_FILE="$(pwd)/.aws_web_identity_token"
    - echo "${AWS_ID_TOKEN}" > "${AWS_WEB_IDENTITY_TOKEN_FILE}"

# ---------------------------------------------------------------------------
# 모듈 검증 — AWS 자격증명 불필요(backend=false). 어떤 컴포넌트가 쓰든 모듈이
# 깨지면 전체에 영향이 가므로, 모듈 자체가 바뀌면 항상 돈다. 8개(경로 구조
# 개편으로 11개에서 축소 — aws-irsa/aws-storage가 공통화를 흡수).
# ---------------------------------------------------------------------------
.module_validate:
  stage: validate
  script:
    - cd terraform/modules/${MODULE}
    - terraform fmt -check -diff
    - terraform init -backend=false -input=false
    - terraform validate

validate:modules:
  extends: .module_validate
  parallel:
    matrix:
      - MODULE: [aws-network, aws-eks, aws-data, aws-dns, aws-storage, aws-irsa, aws-cicd, aws-registry]
  rules:
    - changes:
        - terraform/modules/${MODULE}/**/*

# ---------------------------------------------------------------------------
# 서울 컴포넌트(persistent + rebuild/1~4) — validate(자격증명 불필요) →
# plan(MR, 읽기전용) → apply(main push, 수동 승인 게이트 + 쓰기 권한). 모듈이
# 바뀌어도 모든 컴포넌트가 영향받을 수 있으니 같이 트리거한다. 도쿄의 persistent도
# "상시 운영"(D4)이라 서울과 동일한 자동 plan/수동 apply 취급 — 별도 매크로로 뺌.
# ---------------------------------------------------------------------------
.seoul_matrix: &seoul_matrix
  - COMPONENT_PATH: [persistent, rebuild/1-network, rebuild/2-cluster, rebuild/3-gitops, rebuild/4-edge]

.seoul_changes: &seoul_changes
  - terraform/seoul/${COMPONENT_PATH}/**/*
  - terraform/modules/**/*

validate:seoul:
  stage: validate
  script:
    - cd terraform/seoul/${COMPONENT_PATH}
    - terraform fmt -check -diff
    - terraform init -backend=false -input=false
    - terraform validate
  parallel:
    matrix: *seoul_matrix
  rules:
    - changes: *seoul_changes

plan:seoul:
  extends: .aws_oidc_plan
  stage: plan
  script:
    - cd terraform/seoul/${COMPONENT_PATH}
    - terraform init -backend-config=backend.hcl -input=false
    - terraform plan -input=false
  parallel:
    matrix: *seoul_matrix
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *seoul_changes

apply:seoul:
  extends: .aws_oidc_apply
  stage: apply
  script:
    - cd terraform/seoul/${COMPONENT_PATH}
    - terraform init -backend-config=backend.hcl -input=false
    # 3-gitops 는 CRD 때문에 세 단계로 나눠 apply 한다.
    #
    # kubernetes_manifest 는 plan 때 대상 CRD 가 클러스터에 있어야 스키마를
    # 검증할 수 있다 — 같은 apply 안에서 depends_on 만으로는 "CRD 가 아직 없음"
    # 을 못 피한다(잘 알려진 구조적 한계). 그런데 우리는 CRD 를 두 번 기다려야
    # 한다:
    #   1) argoproj.io/Application  — helm_release.argocd 가 설치
    #   2) karpenter.sh/NodePool · karpenter.k8s.aws/EC2NodeClass
    #      — Argo CD 가 동기화하는 Karpenter Application 이 설치
    #
    # 2단계가 없으면 새 클러스터에서 전체 plan 이
    # `no matches for kind "EC2NodeClass"` 로 실패한다(2026-10-19 시험 구역 1
    # 구축에서 확인, SIM-08a 발견 항목). 기존 클러스터에는 CRD 가 이미 있어
    # 두 target 모두 no-op 이라 영향이 없다.
    #
    # 2단계 target 은 wait_for_karpenter_crds 하나지만, 그 depends_on 이
    # karpenter_app · gitops_repo_creds(비공개 레포 자격증명) ·
    # kube_prometheus_stack_app(ServiceMonitor CRD)까지 그래프로 끌고 온다.
    # 셋 다 있어야 Argo CD 가 karpenter 앱을 동기화할 수 있다 — target 을
    # 더 좁히거나 depends_on 을 줄이면 2단계가 5분 타임아웃으로 죽는다.
    - |
      if [ "$COMPONENT_PATH" = "rebuild/3-gitops" ]; then
        terraform apply -target=helm_release.argocd -input=false -auto-approve
        terraform apply -target=null_resource.wait_for_karpenter_crds -input=false -auto-approve
      fi
    - terraform apply -input=false -auto-approve
  parallel:
    matrix: *seoul_matrix
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
      changes: *seoul_changes
      when: manual
  allow_failure: false

# ---------------------------------------------------------------------------
# 도쿄 persistent — 상시 운영(D4)이라 서울과 동일하게 자동 plan + 수동 승인
# apply. rebuild/*와 분리한 이유는 바로 아래 tokyo-dr 매크로 설명 참고.
# ---------------------------------------------------------------------------
.tokyo_persistent_matrix: &tokyo_persistent_matrix
  - COMPONENT_PATH: [persistent]

.tokyo_persistent_changes: &tokyo_persistent_changes
  - terraform/tokyo/${COMPONENT_PATH}/**/*
  - terraform/modules/**/*

validate:tokyo-persistent:
  stage: validate
  script:
    - cd terraform/tokyo/${COMPONENT_PATH}
    - terraform fmt -check -diff
    - terraform init -backend=false -input=false
    - terraform validate
  parallel:
    matrix: *tokyo_persistent_matrix
  rules:
    - changes: *tokyo_persistent_changes

plan:tokyo-persistent:
  extends: .aws_oidc_plan
  stage: plan
  script:
    - cd terraform/tokyo/${COMPONENT_PATH}
    - terraform init -backend-config=backend.hcl -input=false
    - terraform plan -input=false
  parallel:
    matrix: *tokyo_persistent_matrix
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *tokyo_persistent_changes

apply:tokyo-persistent:
  extends: .aws_oidc_apply
  stage: apply
  script:
    - cd terraform/tokyo/${COMPONENT_PATH}
    - terraform init -backend-config=backend.hcl -input=false
    - terraform apply -input=false -auto-approve
  parallel:
    matrix: *tokyo_persistent_matrix
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
      changes: *tokyo_persistent_changes
      when: manual
  allow_failure: false

# ---------------------------------------------------------------------------
# 도쿄 DR(rebuild/1~5) — plan/apply는 자동 트리거 전혀 없음(changes 조건 자체가
# 없음, when: manual만). validate는 예외 — AWS 자격증명이 필요 없는 공짜 검증이라
# 서울/도쿄 persistent와 동일하게 changes 기반으로 자동 실행한다(2026-10-10,
# 실제 파이프라인 첫 실행에서 이 잡이 빠진 걸 발견해 추가).
# ---------------------------------------------------------------------------
.tokyo_dr_matrix: &tokyo_dr_matrix
  # 🔴 5-peering 은 Stage 2(직접 전송) 전용이라 **1부에서는 돌리지 않는다.**
  # plan/apply 가 전부 when: manual 이라 목록에 있어도 저절로 돌지 않는다.
  # validate 만 changes 기반으로 자동 실행된다(자격증명 불필요).
  - COMPONENT_PATH: [rebuild/1-network, rebuild/2-cluster, rebuild/3-gitops, rebuild/4-edge, rebuild/5-peering]

.tokyo_dr_changes: &tokyo_dr_changes
  - terraform/tokyo/${COMPONENT_PATH}/**/*
  - terraform/modules/**/*

validate:tokyo-dr:
  stage: validate
  script:
    - cd terraform/tokyo/${COMPONENT_PATH}
    - terraform fmt -check -diff
    - terraform init -backend=false -input=false
    - terraform validate
  parallel:
    matrix: *tokyo_dr_matrix
  rules:
    - changes: *tokyo_dr_changes

plan:tokyo-dr:
  extends: .aws_oidc_plan
  stage: plan
  script:
    - cd terraform/tokyo/${COMPONENT_PATH}
    - terraform init -backend-config=backend.hcl -input=false
    - terraform plan -input=false
  parallel:
    matrix: *tokyo_dr_matrix
  rules:
    - when: manual
  allow_failure: true

apply:tokyo-dr:
  extends: .aws_oidc_apply
  stage: apply
  script:
    - cd terraform/tokyo/${COMPONENT_PATH}
    - terraform init -backend-config=backend.hcl -input=false
    # apply:seoul 의 3-gitops 세 단계 apply 와 동일한 이유(CRD 2종 선행 설치).
    # 도쿄는 지운 상태에서 재구축하는 경로라 여기가 실제로 더 자주 탄다.
    #
    # 두 번째 target 은 2026-10-19 현재 도쿄에서 **no-op 이다** — 도쿄
    # 3-gitops 에는 아직 karpenter.tf 가 없다. 없는 주소를 target 으로 주면
    # Terraform 은 "Resource targeting is in effect" 경고만 내고 exit 0 한다
    # (직접 확인). 도쿄 카펜터 도입이 예정돼 있어 **일부러 남겨 둔다** — 그때
    # CI 를 다시 고치지 않아도 재구축이 같은 순서로 돈다. 지우지 말 것.
    #
    # 도쿄에 karpenter.tf 를 들여올 때 — 서울 wait_for_karpenter_crds 의
    # depends_on(karpenter_app · kube_prometheus_stack_app)과 2단계 폴링을
    # 그대로 가져와야 한다. 빠뜨리면 새 클러스터에서 ServiceMonitor CRD 부재로
    # 5분 타임아웃이 난다(서울 karpenter.tf 주석 참고).
    - |
      if [ "$COMPONENT_PATH" = "rebuild/3-gitops" ]; then
        terraform apply -target=helm_release.argocd -input=false -auto-approve
        terraform apply -target=null_resource.wait_for_karpenter_crds -input=false -auto-approve
      fi
    - terraform apply -input=false -auto-approve
  parallel:
    matrix: *tokyo_dr_matrix
  rules:
    - when: manual
  allow_failure: true

# ---------------------------------------------------------------------------
# global/runner — GitLab Runner EC2(7단계, 2026-10-14). global/bootstrap·
# global/cicd와 달리 "CI가 쓸 것 자체를 만드는" 닭과 달걀 컴포넌트가 아니라
# (최초 1회만 로컬/기존 러너로 적용하면 그 뒤부터는 이 컴포넌트가 만든 러너
# 자신이 자기 변경분의 plan/apply를 처리할 수 있음), 다른 일반 컴포넌트와
# 동일하게 validate 자동 + apply 수동으로 CI에 포함한다. 컴포넌트가 하나뿐이라
# matrix 없이 경로를 직접 지정한다.
# ---------------------------------------------------------------------------

validate:global-runner:
  stage: validate
  script:
    - cd terraform/global/runner
    - terraform fmt -check -diff
    - terraform init -backend=false -input=false
    - terraform validate
  rules:
    - changes:
        - terraform/global/runner/**/*
        - terraform/modules/**/*

plan:global-runner:
  extends: .aws_oidc_plan
  stage: plan
  script:
    - cd terraform/global/runner
    - terraform init -backend-config=backend.hcl -input=false
    - terraform plan -input=false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - terraform/global/runner/**/*
        - terraform/modules/**/*

apply:global-runner:
  extends: .aws_oidc_apply
  stage: apply
  script:
    - cd terraform/global/runner
    - terraform init -backend-config=backend.hcl -input=false
    - terraform apply -input=false -auto-approve
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
      changes:
        - terraform/global/runner/**/*
        - terraform/modules/**/*
      when: manual
  allow_failure: false

# ---------------------------------------------------------------------------
# tokyo/runner — 도쿄 DR 러너(2026-10-27). global/runner 와 같은 꼴이지만 리전과
# 상태 키가 다르다.
#
# 🔴 apply 를 자동으로 돌리지 않는 이유가 global/runner 보다 하나 더 있다 —
# 이 러너는 평소 GitLab 에서 Pause 상태다(같은 태그로 켜 두면 서울 잡을
# 가로챈다). 그래서 이 컴포넌트를 바꿔도 apply 는 서울 러너가 수동으로 돌린다.
# 🔴 서울이 빠진 재해 상황에서는 이 파일의 잡들이 전부 이 러너로 간다 —
# 그때는 Pause 를 풀고 tokyo/rebuild/* 수동 잡을 실행한다
# (runbooks/도쿄러너_재해때_깨우기.md).
# ---------------------------------------------------------------------------

validate:tokyo-runner:
  stage: validate
  script:
    - cd terraform/tokyo/runner
    - terraform fmt -check -diff
    - terraform init -backend=false -input=false
    - terraform validate
  rules:
    - changes:
        - terraform/tokyo/runner/**/*
        - terraform/modules/**/*

plan:tokyo-runner:
  extends: .aws_oidc_plan
  stage: plan
  script:
    - cd terraform/tokyo/runner
    - terraform init -backend-config=backend.hcl -input=false
    - terraform plan -input=false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - terraform/tokyo/runner/**/*
        - terraform/modules/**/*

apply:tokyo-runner:
  extends: .aws_oidc_apply
  stage: apply
  script:
    - cd terraform/tokyo/runner
    - terraform init -backend-config=backend.hcl -input=false
    - terraform apply -input=false -auto-approve
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
      changes:
        - terraform/tokyo/runner/**/*
        - terraform/modules/**/*
      when: manual
  allow_failure: false

# ---------------------------------------------------------------------------
# 알람 점검 모드(2026-10-14, 알람 파이프라인 묶음 C) — teardown·점검 전에
# Alertmanager Silence + 데드맨(Healthchecks.io) 일시정지, 끝나면 해제한다.
# 로컬 런북과 같은 스크립트(scripts/alerting/maintenance.sh, README 참고)를 부른다.
# main 파이프라인(push 또는 "Run pipeline")에서 수동 실행 — 사유·기간은 파이프라인
# 변수 MAINT_REASON · MAINT_DURATION(기본 2h)으로 넘긴다.
#
# 권한: 전용 역할 ALERT_MAINT_ROLE_ARN(global/cicd output, main 만 assume) — AWS 권한은
# eks:DescribeCluster 뿐이고, 클러스터 안에서는 Alertmanager 파드 하나에 exec 만 된다
# (rebuild/2-cluster Access Entry 그룹 + gitops rbac-maintenance.yaml). terraform 역할을
# 쓰지 않는 이유도 같다 — 이 잡에 PowerUserAccess 가 필요 없다.
# HC_API_KEY · HC_CHECK_UUID 는 Protected + Masked 변수(main 에서만 노출).
#
# 반영 때 정하는 값(작업계획서 7.1): MAINT_IMAGE(kubectl · aws · curl · bash 가 든 이미지, Shell executor 면 무시).
# 러너는 클러스터 밖 EC2(global/runner, Docker executor)라 러너 → EKS API(443) 경로가 열려 있어야 한다
# (러너 보안그룹은 클러스터 보안그룹 허용 대상이 아님 — 반영 전 러너 담당과 확인).
# 서울만 대상이다(도쿄 rebuild 는 평소 내려가 있음). 도쿄가 필요하면 MAINT_CLUSTER_NAME ·
# MAINT_REGION · HC_CHECK_UUID 를 파이프라인 변수로 바꿔 실행한다.
# ---------------------------------------------------------------------------
.alert_maintenance:
  stage: apply
  image:
    name: ${MAINT_IMAGE}
    entrypoint: [""]
  needs: []
  id_tokens:
    AWS_ID_TOKEN:
      aud: https://aws
  variables:
    MAINT_IMAGE: "alpine/k8s:1.31.4"
    MAINT_CLUSTER_NAME: aquasentinel-dev-apne2-eks
    MAINT_REGION: ap-northeast-2
  before_script:
    - export AWS_ROLE_ARN="${ALERT_MAINT_ROLE_ARN}"
    - export AWS_WEB_IDENTITY_TOKEN_FILE="$(pwd)/.aws_web_identity_token"
    - echo "${AWS_ID_TOKEN}" > "${AWS_WEB_IDENTITY_TOKEN_FILE}"
    - aws eks update-kubeconfig --name "${MAINT_CLUSTER_NAME}" --region "${MAINT_REGION}"
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")
      when: manual
  # 수동 잡이 파이프라인을 "막힘" 상태로 두지 않게 한다(apply 잡과 다르게 선택 실행)
  allow_failure: true

maintenance:start:
  extends: .alert_maintenance
  script:
    - bash scripts/alerting/maintenance.sh start "${MAINT_REASON:-}" "${MAINT_DURATION:-2h}"

maintenance:stop:
  extends: .alert_maintenance
  script:
    - bash scripts/alerting/maintenance.sh stop

maintenance:status:
  extends: .alert_maintenance
  script:
    - bash scripts/alerting/maintenance.sh status
